# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# Application name
spring.application.name=govpay-notify-batch

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Rome

# Spring Batch configuration
spring.batch.job.enabled=false

# Batch configuration
govpay.batch.enabled=true

# Cluster ID configuration (unique identifier for each node in multi-node setup)
govpay.batch.cluster-id=GovPay-Notify-Batch

# Finestra temporale delle rendicontazioni (giorni)
govpay.batch.finestra-temporale=90

# Multi-node job execution timeout configuration
# Maximum minutes since last update before a job is considered stale/stuck (default: 120 minutes = 2 hours)
govpay.batch.stale-threshold-minutes=120

# Scheduler configuration
# Fixed delay between job executions (in milliseconds) - default 2 hours
scheduler.rtNotifyJob.fixedDelayString=7200000
# Initial delay before first execution (in milliseconds) - default 1ms
scheduler.initialDelayString=1

# === Job di spedizione notifiche RT verso API di integrazione Ente ===
# Kill switch globale per la spedizione RT (default disabilitato).
# - Se false: il runner schedulato non viene istanziato (@ConditionalOnProperty)
#   e il BatchController salta il lancio best-effort dall'endpoint /api/batch/run.
# - Se true: il job rtSendJob parte sia da cron sia da API.
govpay.batch.rt-send.enabled=false
# Dimensione chunk reader/processor/writer.
govpay.batch.rt-send.chunk-size=50
# Timeout HTTP applicati al RestTemplate del client EC (millisecondi).
govpay.batch.rt-send.http.connect-timeout-ms=10000
govpay.batch.rt-send.http.read-timeout-ms=30000
# Scheduler dedicato al job RT (cron Spring a 6 campi: sec min hour dom month dow).
# Default ogni minuto al secondo 0, in linea con il monolite GovPay.
scheduler.rtSendJob.cron=0 * * * * *

# Actuator configuration
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
