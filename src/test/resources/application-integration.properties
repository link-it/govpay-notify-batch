# Integration Test Configuration

# Disable banner
spring.main.banner-mode=off

# Application name
spring.application.name=govpay-notify-batch-test

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=WARN
logging.level.it.govpay.notify.batch=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Il JobRepository JDBC (auto-configuration in govpay-common) resta disattivato
# nei test: le tre entity batch di govpay-common e lo schema ufficiale di Spring
# Batch si contendono le stesse tabelle, perche' Hibernate con ddl-auto=create-drop
# le ricrea senza le sequence che il JobRepository richiede. In esercizio lo
# schema arriva dall'immagine (/opt/sql/spring-batch) e il repository e' JDBC.
govpay.batch.job-repository.jdbc.enabled=false
